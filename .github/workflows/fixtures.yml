name: Update Egyptian fixtures
on:
  schedule:
    # كل 5 دقايق من 08:00 لحد 23:55 بتوقيت القاهرة (UTC+2)
    - cron: '*/5 6-21 * * *'
    # بالليل كل نص ساعة
    - cron: '*/30 22-23,0-5 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: fixtures
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-fixtures.mjs
      - name: Fetch TV data (FilGoal)
        run: node scripts/fetch-tv.mjs
        continue-on-error: true
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain fixtures.json tv.json)" ]; then
            git config user.name "korastine-bot"
            git config user.email "korastine-bot@users.noreply.github.com"
            git add fixtures.json
            git add tv.json 2>/dev/null || true
            git commit -m "Update fixtures + TV data"
            git push
            curl -s -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
          fi

name: Update Egyptian fixtures
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: fixtures
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-fixtures.mjs
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain fixtures.json)" ]; then
            git config user.name "korastine-bot"
            git config user.email "korastine-bot@users.noreply.github.com"
            git add fixtures.json
            git commit -m "Update Egyptian fixtures"
            git push
            curl -s -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
          fi

<body>
<svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-ball" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><path d="M12 7.9l3.8 2.7-1.5 4.4H9.7L8.2 10.6z"/><path d="M12 3.4v4.5M4.4 10l3.8.6M19.6 10l-3.8.6M9 20.3l.7-5.3M15 20.3l-.7-5.3"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3.5 20.2h17"/><rect x="5" y="11.5" width="3.6" height="6.2" rx="1.3"/><rect x="10.2" y="7.4" width="3.6" height="10.3" rx="1.3"/><rect x="15.4" y="4" width="3.6" height="13.7" rx="1.3"/></symbol>
  <symbol id="i-target" viewBox="0 0 24 24"><rect x="2.8" y="5" width="18.4" height="14" rx="2.6"/><path d="M12 5v14"/><circle cx="12" cy="12" r="3.1"/><path d="M2.8 9.4h2.6v5.2H2.8M21.2 9.4h-2.6v5.2h2.6"/></symbol>
</svg>

<header class="topbar">
  <a class="brand" href="#/scores" aria-label="كورهسطين">
    <img class="brand-mark" src="assets-brand.svg" alt="">
    <span class="brand-name">كورهسطين<small>KORASTINE</small></span>
  </a>
  <div class="topbar-actions">
    <span class="live-pill" id="livePill"><i></i> <b id="liveCount">0</b> مباشر</span>
    <button class="icon-btn" id="installBtn" hidden>تثبيت</button>
  </div>
</header>

<div class="shell">
  <aside class="sidebar" aria-label="التنقل">
    <nav class="side-nav">
      <a href="#/scores" data-nav="scores" title="النتائج"><svg class="ico"><use href="#i-ball"/></svg><span class="nav-label">النتائج</span></a>
      <a href="#/analysis" data-nav="analysis" title="التحليلات"><svg class="ico"><use href="#i-chart"/></svg><span class="nav-label">التحليلات</span></a>
      <a href="#/match" data-nav="match" title="مباراة اليوم"><svg class="ico"><use href="#i-target"/></svg><span class="nav-label">مباراة اليوم</span></a>
    </nav>
    <div class="rail-title">الدوريات</div>
    <ul class="league-rail" id="leagueRail"></ul>
  </aside>

  <main class="main" id="main">
    <section class="view" id="view-scores" aria-labelledby="scoresTitle">
      <h1 class="sr-only" id="scoresTitle">نتايج الماتشات</h1>
      <article class="featured" id="featured"></article>
      <div class="section-head">
        <h2>الماتشات</h2>
        <span class="data-status" id="dataStatus" aria-live="polite"></span>
      </div>
      <div class="day-strip" id="dayStrip" role="group" aria-label="اختار اليوم"></div>
      <div class="filter-row"><label class="sr-only" for="compFilter">اختار بطولة</label><select class="comp-filter" id="compFilter"></select></div>
      <div class="league-blocks" id="leagueBlocks"></div>
    </section>

    <section class="view" id="view-analysis" hidden aria-labelledby="analysisTitle">
      <h1 class="sr-only" id="analysisTitle">التحليلات</h1>
      <div class="section-head"><h2>تحليلات</h2><span class="badge-demo">بيانات تجريبية</span></div>
      <div class="analysis-rail" id="analysisRail"></div>
    </section>

    <section class="view" id="view-match" hidden aria-labelledby="matchTitle">
      <h1 class="sr-only" id="matchTitle">مباراة اليوم</h1>
      <div class="section-head"><h2>مباراة اليوم</h2><span class="badge-demo">بيانات تجريبية</span></div>
      <div class="match-detail" id="matchDetail"></div>
    </section>
  </main>
</div>

<nav class="tabbar" aria-label="التنقل السريع">
  <a href="#/scores" data-nav="scores"><svg class="ico"><use href="#i-ball"/></svg>النتائج</a>

</nav>

</footer>

<script>
/* منع الكليك يمين واختصارات المطور (بيوقف المستخدم العادي بس) */
(function () {
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); }, true);
  document.addEventListener("keydown", function (e) {
    var k = (e.key || "").toLowerCase();
    if (k === "f12") { e.preventDefault(); e.stopPropagation(); return false; }
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && (k === "i" || k === "j" || k === "c")) { e.preventDefault(); e.stopPropagation(); return false; }
    if ((e.ctrlKey || e.metaKey) && k === "u") { e.preventDefault(); e.stopPropagation(); return false; }
  }, true);
})();
</script>
</body>
</html>

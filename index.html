<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060b10">
<title>كورهسطين — نتايج وتحليل الكورة</title>
<meta name="description" content="كورهسطين: نتايج الماتشات، تحليل، وترتيب الدوريات — عربي أول.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="كورهسطين">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Changa:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-ball" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.2l4.2 3-1.6 5h-5.2l-1.6-5z"/><path d="M12 3v4.2M4.2 9.6l4 1.6M19.8 9.6l-4 1.6M8.1 20.1l1.3-4.9M15.9 20.1l-1.3-4.9"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
  <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/></symbol>
</svg>

<header class="topbar">
  <a class="brand" href="#/scores" aria-label="كورهسطين">
    <img class="brand-mark" src="assets-brand.svg" alt="">
    <span class="brand-name">كورهسطين<small>KORASTINE</small></span>
  </a>
  <div class="topbar-actions">
    <span class="live-pill" id="livePill"><i></i> <b id="liveCount">0</b> مباشر</span>
    <button class="icon-btn" id="installBtn" hidden>تثبيت</button>
  </div>
</header>

<div class="shell">
  <aside class="sidebar" aria-label="التنقل">
    <nav class="side-nav">
      <a href="#/scores" data-nav="scores"><svg class="ico"><use href="#i-ball"/></svg> النتائج</a>
      <a href="#/analysis" data-nav="analysis"><svg class="ico"><use href="#i-chart"/></svg> التحليلات</a>
      <a href="#/match" data-nav="match"><svg class="ico"><use href="#i-target"/></svg> مباراة اليوم</a>
    </nav>
    <div class="rail-title">الدوريات</div>
    <ul class="league-rail" id="leagueRail"></ul>
  </aside>

  <main class="main" id="main">
    <section class="view" id="view-scores" aria-labelledby="scoresTitle">
      <h1 class="sr-only" id="scoresTitle">نتايج الماتشات</h1>
      <article class="featured" id="featured"></article>
      <div class="section-head">
        <h2>الماتشات</h2>
        <span class="data-status" id="dataStatus" aria-live="polite"></span>
      </div>
      <div class="day-strip" id="dayStrip" role="group" aria-label="اختار اليوم"></div>
      <div class="filter-row"><label class="sr-only" for="compFilter">اختار بطولة</label><select class="comp-filter" id="compFilter"></select></div>
      <div class="league-blocks" id="leagueBlocks"></div>
    </section>

    <section class="view" id="view-analysis" hidden aria-labelledby="analysisTitle">
      <h1 class="sr-only" id="analysisTitle">التحليلات</h1>
      <div class="section-head"><h2>تحليلات</h2><span class="badge-demo">بيانات تجريبية</span></div>
      <div class="analysis-rail" id="analysisRail"></div>
    </section>

    <section class="view" id="view-match" hidden aria-labelledby="matchTitle">
      <h1 class="sr-only" id="matchTitle">مباراة اليوم</h1>
      <div class="section-head"><h2>مباراة اليوم</h2><span class="badge-demo">بيانات تجريبية</span></div>
      <div class="match-detail" id="matchDetail"></div>
    </section>
  </main>
</div>

<nav class="tabbar" aria-label="التنقل السريع">
  <a href="#/scores" data-nav="scores"><svg class="ico"><use href="#i-ball"/></svg>النتائج</a>
  <a href="#/analysis" data-nav="analysis"><svg class="ico"><use href="#i-chart"/></svg>التحليلات</a>
  <a href="#/match" data-nav="match"><svg class="ico"><use href="#i-target"/></svg>المباراة</a>
</nav>

<footer class="page-foot">
  <b>كورهسطين · KORASTINE</b>
</footer>

<script src="data.js"></script>
<script src="live.js"></script>
<script src="app.js"></script>
</body>
</html>
